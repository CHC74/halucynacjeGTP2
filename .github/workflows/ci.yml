name: CI — HalucynacjeGTP2 Validation & Packwiz Export

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Walidacja KubeJS, Wysp NBT, Ekonomii i Eksport Packwiz + Exaroton
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Go (pod packwiz)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 1. Sprawdzenie składni wszystkich skryptów KubeJS i narzędzi Node
        run: |
          shopt -s nullglob
          for f in kubejs/*/*.js scripts/*.mjs; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: 2. Walidacja względnych linków Markdown
        run: node scripts/check_markdown_links.mjs

      - name: 3. Walidacja cennika i reguł anty-arbitrażowych
        run: |
          if [ -f scripts/validate_economy.mjs ] && [ -f config/halucynacje_economy/prices.json ]; then
            node scripts/validate_economy.mjs
          else
            echo "Pominięto — brak jeszcze scripts/validate_economy.mjs na tej gałęzi."
          fi

      - name: 4. Walidacja plików JSON i TOML w config/, packwiz/ oraz kubejs/assets/
        run: |
          python3 - <<'PY'
          import glob, json, tomllib
          for p in glob.glob("config/**/*.json", recursive=True) + glob.glob("kubejs/assets/**/*.json", recursive=True):
              with open(p, encoding="utf-8") as f:
                  json.load(f)
          for p in glob.glob("config/**/*.toml", recursive=True) + glob.glob("packwiz/**/*.toml", recursive=True):
              with open(p, "rb") as f:
                  tomllib.load(f)
          print("✅ Wszystkie pliki JSON i TOML poprawne składniowo.")
          PY

      - name: 5. Weryfikacja 3 binarnych szablonów wysp `.nbt` (MC 1.21.1 DataVersion 3955)
        run: python3 scripts/generate_island_nbt.py --verify

      - name: 6. Instalacja packwiz i odświeżenie indeksu
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 7. Weryfikacja packwiz + eksport klienckiego .mrpack
        working-directory: packwiz
        run: |
          mkdir -p ../dist
          packwiz refresh --build
          packwiz mr export -o ../dist/halucynacjeGTP2.mrpack

      - name: 8. Dołączenie overrides/ (config/ + 3 wyspy .nbt + kubejs/) i weryfikacja .mrpack
        run: node scripts/bundle_mrpack_overrides.mjs dist/halucynacjeGTP2.mrpack

      - name: 9. Walidacja budżetu modów, paczki CurseForge App i listy serwerowej Exaroton (dry-run na PR)
        if: github.event_name == 'pull_request'
        run: |
          node scripts/export_curseforge_pack.mjs --dry-run
          node scripts/export_server_pack.mjs --dry-run

      - name: 9b. Pełny eksport natywnej paczki klienckiej CurseForge App (15 CF + 50 JAR Modrinth + overrides)
        if: github.event_name != 'pull_request'
        run: node scripts/export_curseforge_pack.mjs

      - name: 9c. Pełny eksport gotowej paczki serwerowej Exaroton (55/55 JAR + config + kubejs + server.properties)
        if: github.event_name != 'pull_request'
        run: node scripts/export_server_pack.mjs

      - name: 10. Publikacja artefaktu klienckiego CurseForge App (.zip)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: halucynacjeGTP2-client-curseforge
          path: dist/halucynacjeGTP2-curseforge.zip
          if-no-files-found: error

      - name: 11. Publikacja artefaktu klienckiego .mrpack (Prism Launcher / Modrinth App)
        uses: actions/upload-artifact@v4
        with:
          name: halucynacjeGTP2-client-mrpack
          path: dist/halucynacjeGTP2.mrpack
          if-no-files-found: error

      - name: 12. Publikacja artefaktu serwerowego Exaroton (.zip)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: halucynacjeGTP2-server-exaroton
          path: dist/halucynacjeGTP2-server-exaroton.zip
          if-no-files-found: error
