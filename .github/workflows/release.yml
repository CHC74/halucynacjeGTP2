name: Release — HalucynacjeGTP2 Client (CurseForge + .mrpack) & Exaroton Server (.zip)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag wydania GitHub Release (np. v1.0.1-playtest)'
        required: true
        default: 'v1.0.1-playtest'
      prerelease:
        description: 'Oznaczyć jako pre-release (playtest)?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Budowa i publikacja Release (CurseForge .zip + .mrpack + Exaroton Server .zip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Go (pod packwiz)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Ustalenie tagu wydania
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "🏷️  Docelowy tag Release: $TAG (prerelease=$PRERELEASE)"

      - name: 1. Pełna walidacja repozytorium (KubeJS, Testy jednostkowe, Markdown, Ekonomia, NBT)
        run: |
          shopt -s nullglob
          for f in kubejs/*/*.js scripts/*.mjs; do
            node --check "$f"
          done
          node scripts/check_markdown_links.mjs
          node scripts/validate_economy.mjs
          node scripts/test_kubejs_logic.mjs
          python3 scripts/generate_island_nbt.py --verify

      - name: 2. Instalacja packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 3. Budowa natywnej paczki klienckiej CurseForge App (halucynacjeGTP2-curseforge.zip)
        run: |
          mkdir -p dist
          node scripts/export_curseforge_pack.mjs --version "${{ steps.meta.outputs.tag }}"

      - name: 4. Budowa alternatywnego klienckiego halucynacjeGTP2.mrpack (+ overrides z config/, 3 wyspami .nbt i kubejs/)
        run: |
          (cd packwiz && packwiz refresh --build && packwiz mr export -o ../dist/halucynacjeGTP2.mrpack)
          node scripts/bundle_mrpack_overrides.mjs dist/halucynacjeGTP2.mrpack

      - name: 5. Budowa gotowej paczki serwerowej halucynacjeGTP2-server-exaroton.zip (wszystkie 55/55 JAR)
        run: node scripts/export_server_pack.mjs

      - name: 6. Weryfikacja integralności CurseForge ZIP oraz Exaroton Server ZIP
        id: verify_zip
        run: |
          python3 - <<'PY'
          import json, os, zipfile

          # 1. Weryfikacja klienckiego CurseForge ZIP
          cf_zip = "dist/halucynacjeGTP2-curseforge.zip"
          with zipfile.ZipFile(cf_zip, "r") as zf:
              bad = zf.testzip()
              assert bad is None, f"Uszkodzony wpis w CurseForge zip: {bad}"
              names = set(zf.namelist())
              cf_manifest = json.loads(zf.read("manifest.json").decode("utf-8"))
              assert cf_manifest["manifestType"] == "minecraftModpack"
              assert cf_manifest["manifestVersion"] == 1
              assert cf_manifest["minecraft"]["version"] == "1.21.1"
              assert cf_manifest["minecraft"]["modLoaders"][0]["id"] == "neoforge-21.1.267"
              cf_entries = len(cf_manifest["files"])
              embedded_jars = sorted(n for n in names if n.startswith("overrides/mods/") and n.endswith(".jar"))
              cf_total = cf_entries + len(embedded_jars)
              assert cf_total == 65, f"Niezgodna liczba modów klienckich w CurseForge zip: {cf_total} != 65"
              for req in [
                  "manifest.json",
                  "modlist.html",
                  "overrides/kubejs/startup_scripts/stage_tokens.js",
                  "overrides/kubejs/server_scripts/economy_contracts.js",
                  "overrides/kubejs/assets/kubejs/lang/pl_pl.json",
                  "overrides/config/skyblockbuilder/dimensions.json5",
                  "overrides/config/skyblockbuilder/templates/islands/starter_island.nbt",
                  "overrides/config/skyblockbuilder/templates/spreads/market_island.nbt",
                  "overrides/config/skyblockbuilder/templates/spreads/industrial_island.nbt",
                  "overrides/config/ftbquests/quests/data.snbt",
              ]:
                  assert req in names, f"Brak wymaganego pliku w CurseForge zip: {req}"
              print(f"✅ Zweryfikowano CurseForge ZIP: {cf_entries} CF manifest + {len(embedded_jars)} overrides/mods JAR = {cf_total}/65 modów + 3 wyspy .nbt + config + kubejs.")

          # 2. Weryfikacja serwerowego Exaroton ZIP
          srv_zip = "dist/halucynacjeGTP2-server-exaroton.zip"
          with zipfile.ZipFile(srv_zip, "r") as zf:
              bad = zf.testzip()
              assert bad is None, f"Uszkodzony wpis w server zip: {bad}"
              names = set(zf.namelist())
              jars = sorted(n for n in names if n.startswith("mods/") and n.endswith(".jar"))
              manifest = json.loads(zf.read("EXAROTON_MANIFEST.json").decode("utf-8"))
              expected = manifest["server_mods_total"]
              assert len(jars) == expected, f"Niezgodna liczba JAR: {len(jars)} != {expected}"
              for req in [
                  "server.properties",
                  "EXAROTON_MANIFEST.json",
                  "config/skyblockbuilder/dimensions.json5",
                  "config/skyblockbuilder/templates.json5",
                  "config/skyblockbuilder/starter_inventory.json5",
                  "config/skyblockbuilder/templates/islands/starter_island.nbt",
                  "config/skyblockbuilder/templates/spreads/market_island.nbt",
                  "config/skyblockbuilder/templates/spreads/industrial_island.nbt",
                  "config/halucynacje_economy/prices.json",
                  "kubejs/startup_scripts/stage_tokens.js",
                  "kubejs/server_scripts/dimension_gating.js",
                  "kubejs/server_scripts/economy_market.js",
                  "kubejs/server_scripts/economy_contracts.js"
              ]:
                  assert req in names, f"Brak wymaganego pliku w server zip: {req}"
              print(f"✅ Zweryfikowano serwerowy ZIP: {len(jars)}/{expected} JAR ({manifest['downloaded_modrinth_jars']} Modrinth + {manifest['downloaded_curseforge_jars']} CurseForge ForgeCDN) + 3 wyspy .nbt + server.properties.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"cf_manifest_mods={cf_entries}\n")
                  out.write(f"cf_embedded_jars={len(embedded_jars)}\n")
                  out.write(f"cf_total_mods={cf_total}\n")
                  out.write(f"server_jars={len(jars)}\n")
                  out.write(f"server_expected={expected}\n")
                  out.write(f"modrinth_jars={manifest['downloaded_modrinth_jars']}\n")
                  out.write(f"cf_jars={manifest['downloaded_curseforge_jars']}\n")
          PY

      - name: 7. Generacja sum kontrolnych SHA256
        working-directory: dist
        run: |
          sha256sum halucynacjeGTP2-curseforge.zip halucynacjeGTP2-server-exaroton.zip halucynacjeGTP2.mrpack > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 8. Publikacja GitHub Release z paczką kliencką (CurseForge + .mrpack) i serwerową
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"

          python3 - <<'PY' > /tmp/release_notes.md
          import textwrap
          notes = """\
          ## HalucynacjeGTP2 — Create Skyblock Tycoon (NeoForge 1.21.1)

          Gotowe wydanie typu **turnkey** — w pełni kompatybilne z **CurseForge App**, **Exaroton** oraz **Windows / Linux / Apple Silicon Mac M2**!

          ### Zawartość wydania
          - **`halucynacjeGTP2-curseforge.zip`** ⭐ *(Główna paczka dla graczy — **CurseForge App**)* — natywny pakiet CurseForge (**${{ steps.verify_zip.outputs.cf_total_mods }}/65 modów** dla NeoForge `21.1.267` / MC `1.21.1`: **${{ steps.verify_zip.outputs.cf_manifest_mods }}** pobieranych natywnie z API CurseForge + **${{ steps.verify_zip.outputs.cf_embedded_jars }}** zweryfikowanych JAR-ów z Modrinth osadzonych w `overrides/mods/`, komplet `overrides/config/`, 3 binarne wyspy `.nbt`, `overrides/kubejs/`, polskie tłumaczenia i tekstury Żetonów Etapów).
          - **`halucynacjeGTP2-server-exaroton.zip`** — kompletna paczka serwerowa pod **Exaroton**: **${{ steps.verify_zip.outputs.server_jars }}/${{ steps.verify_zip.outputs.server_expected }} plików `.jar`** (${{ steps.verify_zip.outputs.modrinth_jars }} Modrinth + ${{ steps.verify_zip.outputs.cf_jars }} CurseForge ze zweryfikowanymi hashami, 10 modów czysto klienckich odfiltrowanych), `config/` ze zweryfikowanym schematem *Skyblock Builder* 1.21.1 + 3 realnymi plikami `.nbt`, `kubejs/` oraz gotowy `server.properties` (`level-type=skyblockbuilder\\:skyblock`, `allow-flight=true`).
          - **`halucynacjeGTP2.mrpack`** *(Opcja B — Prism Launcher / Modrinth App)* — kompletna paczka kliencka w formacie Modrinth (65 modów + `overrides/`).
          - **`SHA256SUMS.txt`** — sumy kontrolne wszystkich archiwów.

          ### Szybki start (5 minut)
          Pełna instrukcja krok po kroku znajduje się w [docs/QUICKSTART_EXAROTON.md](https://github.com/CHC74/halucynacjeGTP2/blob/main/docs/QUICKSTART_EXAROTON.md):
          1. **Klient — CurseForge App (PC & Mac M2):** Pobierz **`halucynacjeGTP2-curseforge.zip`** → otwórz **CurseForge App** → kliknij **Create Custom Profile** → **Import** → wybierz pobrany plik `.zip` → w ustawieniach profilu ustaw **6 GB RAM (`6144 MB`)** (na **Mac M2** sprawdź użycie natywnej **Java 21 ARM64**) → **Play**!
          2. **Serwer Exaroton:** Software → **NeoForge `1.21.1` (`21.1.267`)** → Options: **RAM 6–8 GB**, **Allow Flight = ON** → Files: wrzuć rozpakowane `mods/`, `config/`, `kubejs/` z `halucynacjeGTP2-server-exaroton.zip` → Worlds → Generate → Worldtype: **`skyblockbuilder:skyblock`** → **Start**!
          3. **W grze:** Spawn na Wyspie Startowej `(0, 65, 0)` z widokiem wprost na Wyspę-Rynek `(+152E)`. Po postawieniu sklepów wpisz (jako OP) `/halucynacje_sync_shoppers`. Dostępne komendy graczy: `/ekonomia`, `/sprzedaj`, `/sklep`, `/kup`, `/cennik`, `/kontrakt`.

          ### Co zostało zweryfikowane w tej wersji
          - ✅ Natywny import w **CurseForge App** (`halucynacjeGTP2-curseforge.zip`): wszystkie **65/65 modów** (15 CF + 50 zweryfikowanych JAR-ów Modrinth w `overrides/mods/`), `manifest.json` z `neoforge-21.1.267`, `modlist.html` i pełny `overrides/`.
          - ✅ Schemat `config/skyblockbuilder/*.json5` dopasowany 1:1 do kodu źródłowego `MelanX/SkyblockBuilder` (`21.1.37` / `1.21.x`): Overworld = pustka 3 wysp (`plains`), **Nether i End = 100% normalna generacja waniliowa** (`dimensions.json5`).
          - ✅ 3 binarne pliki struktur Minecraft 1.21.1 (`DataVersion 3955`, czyste bloki waniliowe): `starter_island.nbt` (15×13×15 ze skrzynią anty-softlock i Pirsem Wschodnim), `market_island.nbt` (29×9×25, 100% płaski plac pod `Shoppers`, 8 stoisk z tylną aleją Create, 3 pady ATM), `industrial_island.nbt` (21×7×21, Dok Północny).
          - ✅ Zweryfikowane na prawdziwych plikach JAR 1.21.1 receptury Create 6.0.10 (`neoforge:single`) i Mechanical Extruder 2.2.2 (`blockIngredients`), dynamiczne kontrakty fabryczne `/kontrakt` (+35%), testy jednostkowe KubeJS, anty-arbitraż, księga *FTB Quests* (Stage 0–5), `keepInventory = true`, bezpieczeństwo Mac M2 (zero *Valkyrien Skies* / *Clockwork*, zero magii, zero *Ex Deorum*).
          """
          print(textwrap.dedent(notes))
          PY

          # Zapisz tag na aktualny commit (jeśli odpalone ręcznie przez workflow_dispatch)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG"
            git push origin "refs/tags/$TAG" --force
          fi

          EXTRA_FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "HalucynacjeGTP2 $TAG — Create Skyblock Tycoon" --notes-file /tmp/release_notes.md "${EXTRA_FLAGS[@]}"
            gh release upload "$TAG" dist/halucynacjeGTP2-curseforge.zip dist/halucynacjeGTP2-server-exaroton.zip dist/halucynacjeGTP2.mrpack dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/halucynacjeGTP2-curseforge.zip dist/halucynacjeGTP2-server-exaroton.zip dist/halucynacjeGTP2.mrpack dist/SHA256SUMS.txt \
              --title "HalucynacjeGTP2 $TAG — Create Skyblock Tycoon" \
              --notes-file /tmp/release_notes.md \
              "${EXTRA_FLAGS[@]}"
          fi
