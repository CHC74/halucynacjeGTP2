name: Release — HalucynacjeGTP2 Client (CurseForge + .mrpack) & Exaroton Server (.zip)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag wydania GitHub Release (np. v1.0.1-playtest)'
        required: true
        default: 'v1.0.1-playtest'
      prerelease:
        description: 'Oznaczyć jako pre-release (playtest)?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Budowa i publikacja Release (CurseForge .zip + .mrpack + Exaroton Server .zip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Go (pod packwiz)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Ustalenie tagu wydania
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            PRERELEASE="$INPUT_PRERELEASE"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "🏷️  Docelowy tag Release: $TAG (prerelease=$PRERELEASE)"

      - name: 1. Pełna walidacja repozytorium (KubeJS, Testy jednostkowe, Markdown, Ekonomia, NBT)
        run: |
          shopt -s nullglob
          for f in kubejs/*/*.js scripts/*.mjs; do
            node --check "$f"
          done
          node scripts/check_markdown_links.mjs
          node scripts/validate_economy.mjs
          node scripts/test_kubejs_logic.mjs
          python3 scripts/generate_island_nbt.py --verify

      - name: 2. Instalacja packwiz
        run: |
          go install github.com/packwiz/packwiz@170b22d785959dda5876b54b7f16e1b807a57fb6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 3. Budowa natywnej paczki klienckiej CurseForge App (halucynacjeGTP2-curseforge.zip)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p dist
          node scripts/export_curseforge_pack.mjs --version "$TAG"

      - name: 4. Budowa alternatywnego klienckiego halucynacjeGTP2.mrpack (+ overrides z config/, 3 wyspami .nbt i kubejs/)
        run: |
          (cd packwiz && packwiz refresh --build && packwiz mr export -o ../dist/halucynacjeGTP2.mrpack)
          node scripts/bundle_mrpack_overrides.mjs dist/halucynacjeGTP2.mrpack

      - name: 5. Budowa gotowej paczki serwerowej halucynacjeGTP2-server-exaroton.zip (wszystkie 55/55 JAR)
        run: node scripts/export_server_pack.mjs

      - name: 6. Weryfikacja integralności CurseForge ZIP oraz Exaroton Server ZIP
        id: verify_zip
        run: |
          python3 - <<'PY'
          import json, os, zipfile

          # 1. Weryfikacja klienckiego CurseForge ZIP
          cf_zip = "dist/halucynacjeGTP2-curseforge.zip"
          with zipfile.ZipFile(cf_zip, "r") as zf:
              bad = zf.testzip()
              assert bad is None, f"Uszkodzony wpis w CurseForge zip: {bad}"
              names = set(zf.namelist())
              cf_manifest = json.loads(zf.read("manifest.json").decode("utf-8"))
              assert cf_manifest["manifestType"] == "minecraftModpack"
              assert cf_manifest["manifestVersion"] == 1
              assert cf_manifest["minecraft"]["version"] == "1.21.1"
              assert cf_manifest["minecraft"]["modLoaders"][0]["id"] == "neoforge-21.1.267"
              cf_entries = len(cf_manifest["files"])
              embedded_jars = sorted(n for n in names if n.startswith("overrides/mods/") and n.endswith(".jar"))
              cf_total = cf_entries + len(embedded_jars)
              assert cf_total == 65, f"Niezgodna liczba modów klienckich w CurseForge zip: {cf_total} != 65"
              for req in [
                  "manifest.json",
                  "modlist.html",
                  "overrides/kubejs/startup_scripts/stage_tokens.js",
                  "overrides/kubejs/server_scripts/economy_contracts.js",
                  "overrides/kubejs/assets/kubejs/lang/pl_pl.json",
                  "overrides/config/skyblockbuilder/dimensions.json5",
                  "overrides/config/skyblockbuilder/templates/islands/starter_island.nbt",
                  "overrides/config/skyblockbuilder/templates/spreads/market_island.nbt",
                  "overrides/config/skyblockbuilder/templates/spreads/industrial_island.nbt",
                  "overrides/config/ftbchunks-world.snbt",
                  "overrides/config/ftbessentials.snbt",
                  "overrides/config/ftbquests/quests/data.snbt",
                  "overrides/defaultconfigs/sophisticatedstorage-server.toml",
              ]:
                  assert req in names, f"Brak wymaganego pliku w CurseForge zip: {req}"
              print(f"✅ Zweryfikowano CurseForge ZIP: {cf_entries} CF manifest + {len(embedded_jars)} overrides/mods JAR = {cf_total}/65 modów + 3 wyspy .nbt + config + defaultconfigs + kubejs.")

          # 2. Weryfikacja serwerowego Exaroton ZIP
          srv_zip = "dist/halucynacjeGTP2-server-exaroton.zip"
          with zipfile.ZipFile(srv_zip, "r") as zf:
              bad = zf.testzip()
              assert bad is None, f"Uszkodzony wpis w server zip: {bad}"
              names = set(zf.namelist())
              jars = sorted(n for n in names if n.startswith("mods/") and n.endswith(".jar"))
              manifest = json.loads(zf.read("EXAROTON_MANIFEST.json").decode("utf-8"))
              expected = manifest["server_mods_total"]
              assert len(jars) == expected, f"Niezgodna liczba JAR: {len(jars)} != {expected}"
              for req in [
                  "server.properties",
                  "EXAROTON_MANIFEST.json",
                  "config/skyblockbuilder/dimensions.json5",
                  "config/skyblockbuilder/templates.json5",
                  "config/skyblockbuilder/starter_inventory.json5",
                  "config/skyblockbuilder/templates/islands/starter_island.nbt",
                  "config/skyblockbuilder/templates/spreads/market_island.nbt",
                  "config/skyblockbuilder/templates/spreads/industrial_island.nbt",
                  "config/ftbchunks-world.snbt",
                  "config/ftbessentials.snbt",
                  "config/halucynacje_economy/prices.json",
                  "defaultconfigs/sophisticatedstorage-server.toml",
                  "kubejs/startup_scripts/stage_tokens.js",
                  "kubejs/server_scripts/dimension_gating.js",
                  "kubejs/server_scripts/economy_market.js",
                  "kubejs/server_scripts/economy_contracts.js"
              ]:
                  assert req in names, f"Brak wymaganego pliku w server zip: {req}"
              print(f"✅ Zweryfikowano serwerowy ZIP: {len(jars)}/{expected} JAR ({manifest['downloaded_modrinth_jars']} Modrinth + {manifest['downloaded_curseforge_jars']} CurseForge ForgeCDN) + 3 wyspy .nbt + defaultconfigs + server.properties.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"cf_manifest_mods={cf_entries}\n")
                  out.write(f"cf_embedded_jars={len(embedded_jars)}\n")
                  out.write(f"cf_total_mods={cf_total}\n")
                  out.write(f"server_jars={len(jars)}\n")
                  out.write(f"server_expected={expected}\n")
                  out.write(f"modrinth_jars={manifest['downloaded_modrinth_jars']}\n")
                  out.write(f"cf_jars={manifest['downloaded_curseforge_jars']}\n")
          PY

      - name: 6b. Budowa lekkiego patcha serwerowego (halucynacjeGTP2-server-patch.zip — tylko zmienione pliki od poprzedniego wydania)
        id: build_patch
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python3 - "$TAG" <<'PY'
          import os, subprocess, sys, zipfile

          cur_tag = sys.argv[1]
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*", "--sort=-version:refname"], text=True
          ).splitlines()
          prev_tag = next((t.strip() for t in tags if t.strip() and t.strip() != cur_tag), None)

          changed = []
          if prev_tag:
              diff_out = subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=ACMR", f"{prev_tag}..HEAD"],
                  text=True,
              ).splitlines()
              for p in diff_out:
                  p = p.strip()
                  if not p or not os.path.isfile(p):
                      continue
                  if p.startswith(("kubejs/", "config/", "defaultconfigs/")):
                      changed.append((p, p))
                  elif p == "server.properties.template":
                      changed.append((p, "server.properties"))

          if not changed:
              for root, _, files in os.walk("kubejs/server_scripts"):
                  for fn in sorted(files):
                      if fn.endswith(".js"):
                          rel = os.path.join(root, fn)
                          changed.append((rel, rel))

          out_zip = "dist/halucynacjeGTP2-server-patch.zip"
          with zipfile.ZipFile(out_zip, "w", zipfile.ZIP_DEFLATED) as zf:
              for src, arc in changed:
                  zf.write(src, arc)

          with zipfile.ZipFile(out_zip, "r") as zf:
              assert zf.testzip() is None, "Uszkodzony archiwum patcha!"
              entries = zf.namelist()

          print(f"✅ Patch serwerowy ({prev_tag or 'initial'} -> {cur_tag}): {len(entries)} plików: {entries}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"patch_from={prev_tag or 'initial'}\n")
              out.write(f"patch_count={len(entries)}\n")
              out.write(f"patch_files={', '.join(entries)}\n")
          PY

      - name: 7. Generacja sum kontrolnych SHA256
        working-directory: dist
        run: |
          sha256sum halucynacjeGTP2-curseforge.zip halucynacjeGTP2-server-exaroton.zip halucynacjeGTP2-server-patch.zip halucynacjeGTP2.mrpack > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 8. Publikacja GitHub Release z paczką kliencką (CurseForge + .mrpack), serwerową i lekkim patchem
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' > /tmp/release_notes.md
          import textwrap
          notes = """\
          ## HalucynacjeGTP2 — Create Skyblock Tycoon (NeoForge 1.21.1)

          Gotowe wydanie typu **turnkey** — w pełni kompatybilne z **CurseForge App**, **Exaroton** oraz **Windows / Linux / Apple Silicon Mac M2**!

          ### Zawartość wydania
          - **`halucynacjeGTP2-server-patch.zip`** ⚡ *(Szybka aktualizacja Exaroton — **tylko zmienione pliki** od `${{ steps.build_patch.outputs.patch_from }}`, razem **${{ steps.build_patch.outputs.patch_count }}** szt.: `${{ steps.build_patch.outputs.patch_files }}`)* — rozpakuj i wgraj ten jeden folder na Exaroton (nadpisując istniejące pliki), a następnie wpisz `/reload` lub zrestartuj serwer!
          - **`halucynacjeGTP2-curseforge.zip`** ⭐ *(Główna paczka dla graczy — **CurseForge App**)* — natywny pakiet CurseForge (**${{ steps.verify_zip.outputs.cf_total_mods }}/65 modów** dla NeoForge `21.1.267` / MC `1.21.1`: **${{ steps.verify_zip.outputs.cf_manifest_mods }}** pobieranych natywnie z API CurseForge + **${{ steps.verify_zip.outputs.cf_embedded_jars }}** zweryfikowanych JAR-ów z Modrinth osadzonych w `overrides/mods/`, komplet `overrides/config/`, 3 binarne wyspy `.nbt`, `overrides/kubejs/`, polskie tłumaczenia i tekstury Żetonów Etapów).
          - **`halucynacjeGTP2-server-exaroton.zip`** — pełna paczka serwerowa pod **Exaroton** (nowa instalacja): **${{ steps.verify_zip.outputs.server_jars }}/${{ steps.verify_zip.outputs.server_expected }} plików `.jar`** (${{ steps.verify_zip.outputs.modrinth_jars }} Modrinth + ${{ steps.verify_zip.outputs.cf_jars }} CurseForge ze zweryfikowanymi hashami, 10 modów czysto klienckich odfiltrowanych), `config/`, `defaultconfigs/`, `kubejs/` oraz gotowy `server.properties`.
          - **`halucynacjeGTP2.mrpack`** *(Opcja B — Prism Launcher / Modrinth App)* — kompletna paczka kliencka w formacie Modrinth (65 modów + `overrides/`).
          - **`SHA256SUMS.txt`** — sumy kontrolne wszystkich archiwów.

          ### Szybki start (5 minut)
          Pełna instrukcja krok po kroku znajduje się w [docs/QUICKSTART_EXAROTON.md](https://github.com/CHC74/halucynacjeGTP2/blob/main/docs/QUICKSTART_EXAROTON.md):
          1. **Szybki update działającego serwera Exaroton:** Pobierz **`halucynacjeGTP2-server-patch.zip`**, rozpakuj i podmień pliki w katalogu głównym serwera (nadpisując stare wersje; pliki z `defaultconfigs/` na *już utworzonym* świecie skopiuj także do `world/serverconfig/`) → wpisz `/reload` lub zrestartuj serwer.
          2. **Klient — CurseForge App (PC & Mac M2):** Pobierz **`halucynacjeGTP2-curseforge.zip`** → **Create Custom Profile** → **Import** → **6 GB RAM (`6144 MB`)** → **Play**!
          3. **Nowy serwer Exaroton:** Software → **NeoForge `1.21.1` (`21.1.267`)** → Options: **RAM 6–8 GB**, **Allow Flight = ON** → Files: wrzuć rozpakowane `mods/`, `config/`, `defaultconfigs/`, `kubejs/` z `halucynacjeGTP2-server-exaroton.zip` → Worlds → Generate → Worldtype: **`skyblockbuilder:skyblock`** → **Start**!
          """
          print(textwrap.dedent(notes))
          PY

          # Zapisz tag na aktualny commit (jeśli odpalone ręcznie przez workflow_dispatch)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG"
            git push origin "refs/tags/$TAG" --force
          fi

          EXTRA_FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "HalucynacjeGTP2 $TAG — Create Skyblock Tycoon" --notes-file /tmp/release_notes.md "${EXTRA_FLAGS[@]}"
            gh release upload "$TAG" dist/halucynacjeGTP2-curseforge.zip dist/halucynacjeGTP2-server-exaroton.zip dist/halucynacjeGTP2-server-patch.zip dist/halucynacjeGTP2.mrpack dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/halucynacjeGTP2-curseforge.zip dist/halucynacjeGTP2-server-exaroton.zip dist/halucynacjeGTP2-server-patch.zip dist/halucynacjeGTP2.mrpack dist/SHA256SUMS.txt \
              --title "HalucynacjeGTP2 $TAG — Create Skyblock Tycoon" \
              --notes-file /tmp/release_notes.md \
              "${EXTRA_FLAGS[@]}"
          fi
