# =============================================================================
# HalucynacjeGTP2 — Szablon konfiguracji serwerowej Shoppers (LC Addon 1.21.1)
# Zgodnie z ustaleniami RFC #5 i docs/ISLAND_DESIGN.md (ochrona TPS Exaroton).
#
# [VERIFY ON 1.21.1 BOOT]: Dokładne nazwy kluczy TOML potwierdzić z plikiem
# wygenerowanym przez `Shoppers v1.0.2` na NeoForge 1.21.1.
# =============================================================================

[spawning]
# Limit aktywnych NPC w hubie Wyspy-Rynku (RFC #5: 8-12 NPC dla stabilnych 20 TPS na Exaroton)
maxShoppersPerHub = 10
maxTotalShoppers = 12
spawnRadiusMin = 20
spawnRadiusMax = 36

[economy]
# Wyłączenie losowych zachowań kasynowych (Slot Machines są zablokowane w KubeJS)
enableCasinoBehavior = false
# Harmonogram dzienny Wyspy-Rynku (poranny szczyt / wygaszanie w nocy)
enableDailySchedule = true

[performance]
# Interwał skanowania sklepów w pobliżu graczy (w tickach: 100 = 5 sekund)
shopScanIntervalTicks = 100
pathfindingCooldownTicks = 60
